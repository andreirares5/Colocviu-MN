<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Expected Goals – Demo QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }
        button {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result, .error {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
        }
        .result {
            background-color: #e8f5e9;
        }
        .error {
            background-color: #ffebee;
        }
    </style>
</head>
<body>
    <h1>Expected Goals – Demo QR cu reflectori</h1>

    <form method="POST">
        <label for="distance">Distanța față de poartă (m):</label>
        <input type="number" id="distance" name="distance" step="0.1" min="0" max="52.5" required>

        <label for="angle">Unghi față de poartă (grade):</label>
        <input type="number" id="angle" name="angle" step="0.1" min="0" max="90" required>

        <label for="body_part">Parte a corpului:</label>
        <select id="body_part" name="body_part" required>
            <option value="foot">Picior</option>
            <option value="head">Cap</option>
        </select>

        <button type="submit">Calculează xG</button>
    </form>

    {% if xg_value is not none %}
        <div class="result">
            <strong>xG estimat:</strong>
            {{ "%.3f"|format(xg_value) }}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}
</body>
</html>
